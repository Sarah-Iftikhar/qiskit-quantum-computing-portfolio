[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-quantum-computing-portfolio"
version = "0.1.0"
description = "An educational Qiskit portfolio: entanglement, VQE, time evolution, and transpilation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "qiskit==2.5.2",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "pylatexenc==2.11",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4,<5",
  "ipykernel==7.4.0",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
]

[project.scripts]
qiskit-portfolio = "qiskit_portfolio.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
